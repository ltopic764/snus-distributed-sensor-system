apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: snus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: snus-notification-service:latest

          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: snus-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

---

apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: snus
spec:
  selector:
    app: notification-service

  ports:
    - name: http
      port: 8080
      targetPort: 8080

  type: ClusterIP