apiVersion: apps/v1
kind: Deployment
metadata:
  name: consensus-service
  namespace: snus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: consensus-service

  template:
    metadata:
      labels:
        app: consensus-service

    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h postgres-service \
                -p 5432 \
                -U postgres \
                -d snus;
              do
                echo "Waiting for PostgreSQL...";
                sleep 2;
              done

      containers:
        - name: consensus-service
          image: snus-consensus-service:latest

          imagePullPolicy: Never

          env:
            - name: DOTNET_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: snus-config
                  key: DOTNET_ENVIRONMENT

            - name: ConnectionStrings__SensorDb
              valueFrom:
                configMapKeyRef:
                  name: snus-config
                  key: CONNECTION_STRING

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -r /proc/1/cmdline
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -r /proc/1/cmdline
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5