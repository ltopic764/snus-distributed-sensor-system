apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  namespace: snus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ingress

  template:
    metadata:
      labels:
        app: ingress

    spec:
      containers:
        - name: ingress
          image: snus-ingress:latest

          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: snus-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            - name: ReverseProxy__Clusters__ingestion-cluster__Destinations__primary__Address
              value: "http://ingestion-service:8080/"

            - name: ReverseProxy__Clusters__notification-cluster__Destinations__primary__Address
              value: "http://notification-service:8080/"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

---

apiVersion: v1
kind: Service
metadata:
  name: ingress-service
  namespace: snus
spec:
  selector:
    app: ingress

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

  type: NodePort